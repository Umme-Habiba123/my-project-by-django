<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student List</title>
</head>

<body>

    <h1>Student List</h1>

    <a href="{% url 'add_student' %}">Add Student</a>

    <br><br>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Action</th>
            
            </tr>
        </thead>

        <tbody>

            {% for student in students %}

            <tr>
                <td>{{ student.id }}</td>

                <td>
                    
                        {{ student.name }}
                   
                </td>

                <td>{{ student.email }}</td>

                <td>{{ student.age }}</td>
                <td><a href="{% url 'edit-student' student.id %}">Edit</a>
                 </td>
                <td><a href="{% url 'student-details' student.id %}">Details</a>
                 </td>

            </tr>

            {% empty %}

            <tr>
                <td colspan="4">
                    No students found.
                </td>
            </tr>

            {% endfor %}

        </tbody>
    </table>

</body>
</html>
